# ═══════════════════════════════════════════════════════════
# OmniTix Ledger — Local dev overrides
# Activated with SPRING_PROFILES_ACTIVE=local
# ═══════════════════════════════════════════════════════════

spring:
  datasource:
    # Local dev: Postgres runs in Docker, exposed on host port 5433
    url: jdbc:postgresql://127.0.0.1:5433/omnitix?currentSchema=ledger,public
    username: omnitix_ledger
    password: omnitix_ledger_dev_password

  kafka:
    bootstrap-servers: 127.0.0.1:29092

  jpa:
    show-sql: false

logging:
  level:
    root: INFO
    com.omnitix: DEBUG
    org.flywaydb: INFO
    org.hibernate.SQL: WARN

grpc:
  server:
    port: 50053