# ═══════════════════════════════════════════════════════════
# OmniTix Ledger — Application config
# ═══════════════════════════════════════════════════════════

spring:
  application:
    name: omnitix-ledger

  # ─── PostgreSQL (isolated `ledger` schema) ─────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:omnitix}?currentSchema=ledger,public
    username: ${DB_USER:omnitix_ledger}
    password: ${DB_PASSWORD:omnitix_ledger_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: omnitix-ledger-pool

  # ─── JPA / Hibernate ──────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # dialect auto-detected from JDBC connection (postgres)
        format_sql: false
        jdbc:
          time_zone: UTC
        default_schema: ledger
    open-in-view: false
    show-sql: false

  # ─── Flyway ───────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ledger
    default-schema: ledger
    baseline-on-migrate: false
    validate-on-migrate: true

  # ─── Kafka ────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        linger.ms: 5
        compression.type: snappy
    client-id: omnitix-ledger

  # ─── Jackson ──────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# ─── Web server (actuator + eventual admin UI) ─────────
server:
  port: ${LEDGER_ACTUATOR_PORT:8081}

# ─── gRPC ──────────────────────────────────────────────
grpc:
  server:
    port: ${LEDGER_GRPC_PORT:50053}
    enable-reflection: true
    max-inbound-message-size: 4194304

# ─── Payment adapter ───────────────────────────────────
ledger:
  http:
    port: ${LEDGER_HTTP_PORT:8082}
  payment:
    adapter: ${PAYMENT_ADAPTER:mock}
    mock:
      failure-rate: 0.0
      latency-ms: 50
  currency: USD
  payout:
    schedule: weekly
    holdback-days: 7

# ─── Actuator (HTTP health) ────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  # actuator uses the same server.port now
  server:
    port: ${LEDGER_ACTUATOR_PORT:8081}

# ─── Logging ───────────────────────────────────────────
logging:
  level:
    root: INFO
    com.omnitix: DEBUG
    org.hibernate.SQL: WARN
    org.springframework.kafka: WARN