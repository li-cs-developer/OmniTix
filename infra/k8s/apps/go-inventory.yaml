apiVersion: v1
kind: Service
metadata:
  name: go-inventory
  namespace: omnitix
spec:
  selector:
    app: go-inventory
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  - port: 50051
    targetPort: 50051
    name: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-inventory
  namespace: omnitix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-inventory
  template:
    metadata:
      labels:
        app: go-inventory
    spec:
      containers:
      - name: go-inventory
        image: omnitix/go-inventory:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        - containerPort: 50051
        envFrom:
        - configMapRef:
            name: omnitix-config
        - secretRef:
            name: omnitix-secrets
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
