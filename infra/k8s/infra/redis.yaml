apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: omnitix
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: omnitix
data:
  redis.conf: |
    appendonly yes
    appendfsync everysec
    notify-keyspace-events "Ex"
    maxmemory 512mb
    maxmemory-policy noeviction
    save 60 1000
    save 300 10000
    loglevel notice
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: omnitix
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command: ["redis-server", "/etc/redis/redis.conf"]
        ports:
        - containerPort: 6379
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /etc/redis
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: redis-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 2Gi
