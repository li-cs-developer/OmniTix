apiVersion: v1
kind: ConfigMap
metadata:
  name: omnitix-config
  namespace: omnitix
data:
  APP_ENV: "local"
  DB_CONNECTION: "pgsql"
  DB_HOST: "postgres.omnitix.svc.cluster.local"
  DB_PORT: "5432"
  DB_DATABASE: "omnitix"
  DB_USERNAME: "omnitix"
  DB_SEARCH_PATH: "app,public"
  REDIS_HOST: "redis.omnitix.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_CACHE_DB: "1"
  KAFKA_BROKERS: "kafka.omnitix.svc.cluster.local:9092"
  KAFKA_BROKERS_HOST: "kafka.omnitix.svc.cluster.local:9092"
  KAFKA_GROUP_PREFIX: "omnitix"
  KAFKA_CONSUMER_GROUP: "omnitix-laravel-core"
  LARAVEL_INTERNAL_URL: "http://laravel-core.omnitix.svc.cluster.local:8000"
  INVENTORY_HTTP_URL: "http://go-inventory.omnitix.svc.cluster.local:8080"
  INVENTORY_GRPC_HOST: "go-inventory.omnitix.svc.cluster.local"
  INVENTORY_GRPC_PORT: "50051"
  CRYPTO_HTTP_URL: "http://rust-crypto.omnitix.svc.cluster.local:50054"
  CRYPTO_GRPC_HOST: "rust-crypto.omnitix.svc.cluster.local"
  CRYPTO_GRPC_PORT: "50052"
  LEDGER_GRPC_HTTP_URL: "http://kotlin-ledger.omnitix.svc.cluster.local:8082"
  LEDGER_GRPC_HOST: "kotlin-ledger.omnitix.svc.cluster.local"
  LEDGER_GRPC_PORT: "50053"
  NEXT_PUBLIC_LARAVEL_URL: "http://localhost:18080"
  NEXT_PUBLIC_INVENTORY_URL: "http://localhost:18080"
  NEXT_PUBLIC_WS_URL: "http://localhost:18080"
  NEXT_PUBLIC_WS_PATH: "/ws"
  AWS_ENDPOINT: "http://seaweedfs.omnitix.svc.cluster.local:8333"
  AWS_BUCKET: "omnitix-tickets"
  AWS_USE_PATH_STYLE_ENDPOINT: "true"
  AWS_DEFAULT_REGION: "us-east-1"
  KEY_ID: "v1"
  KEY_PATH: "keys"
  GRPC_PORT: "50052"
  HTTP_PORT: "50054"
  PAYMENT_ADAPTER: "mock"
  HOLD_TTL_SECONDS: "600"
  WS_PORT: "3001"
