apiVersion: v1
kind: Service
metadata:
  name: nextjs-storefront
  namespace: omnitix
spec:
  selector:
    app: nextjs-storefront
  ports:
  - port: 3000
    targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjs-storefront
  namespace: omnitix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextjs-storefront
  template:
    metadata:
      labels:
        app: nextjs-storefront
    spec:
      containers:
      - name: nextjs-storefront
        image: omnitix/nextjs-storefront:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: omnitix-config
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 5
