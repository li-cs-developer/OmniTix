  nestjs-ws:
    build:
      context: ./services/nestjs-ws
      dockerfile: Dockerfile.dev
    container_name: omnitix-nestjs-ws
    restart: unless-stopped
    ports:
      - "${WS_PORT:-3001}:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_PREFIX: ""        # <-- add this line
      # ... (other env vars as they exist in your file)
    depends_on:
      - redis
      - kafka
    networks:
      - omnitix_net