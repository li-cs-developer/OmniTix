apiVersion: v1
kind: Service
metadata:
  name: nestjs-ws
  namespace: omnitix
spec:
  selector:
    app: nestjs-ws
  ports:
  - port: 3001
    targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nestjs-ws
  namespace: omnitix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nestjs-ws
  template:
    metadata:
      labels:
        app: nestjs-ws
    spec:
      containers:
      - name: nestjs-ws
        image: omnitix/nestjs-ws:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
        envFrom:
        - configMapRef:
            name: omnitix-config
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 5
