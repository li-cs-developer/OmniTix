# ═══════════════════════════════════════════════════════════
# OmniTix — Redis configuration (local dev)
# ═══════════════════════════════════════════════════════════

# ─── Persistence ────────────────────────────────────────
# AOF guarantees holds survive container restarts.
appendonly yes
appendfsync everysec

# ─── Keyspace notifications ─────────────────────────────
# "Ex" = keyspace events for expired keys, using the "__keyevent@N__:expired" channel.
# The Go Inventory Service subscribes to this channel to publish SeatExpired events.
notify-keyspace-events "Ex"

# ─── Memory policy ──────────────────────────────────────
# Never silently evict a seat hold. If we hit memory limits we want
# the hold to fail loudly so the caller can retry, not lose data.
maxmemory 512mb
maxmemory-policy noeviction

# ─── Snapshots (belt-and-braces alongside AOF) ──────────
save 60 1000
save 300 10000

# ─── Logging ────────────────────────────────────────────
loglevel notice