[package]
name = "omnitix-crypto"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "OmniTix Ed25519 ticket signing service"
license = "MIT"

[[bin]]
name = "omnitix-crypto"
path = "src/main.rs"

[dependencies]
# ─── Async runtime ──────────────────────────────────────
tokio = { version = "1.42", features = ["full"] }
axum = "0.8"

# ─── gRPC ───────────────────────────────────────────────
tonic = "0.12"
tonic-reflection = "0.12"
prost = "0.13"
prost-types = "0.13"

# ─── Cryptography ───────────────────────────────────────
ed25519-dalek = { version = "2.1", features = ["rand_core", "pkcs8"] }
rand = "0.8"
base64 = "0.22"
hex = "0.4"

# ─── JSON ───────────────────────────────────────────────
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json_canonicalizer = "0.3"

# ─── Config ─────────────────────────────────────────────
dotenvy = "0.15"
envy = "0.4"

# ─── Logging ────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# ─── Errors ─────────────────────────────────────────────
thiserror = "2.0"
anyhow = "1.0"

# ─── Time ───────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "sign_verify"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"