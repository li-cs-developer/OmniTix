apiVersion: v1
kind: Service
metadata:
  name: laravel-core
  namespace: omnitix
spec:
  selector:
    app: laravel-core
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-core
  namespace: omnitix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: laravel-core
  template:
    metadata:
      labels:
        app: laravel-core
    spec:
      initContainers:
      - name: migrate
        image: omnitix/laravel-core:latest
        imagePullPolicy: IfNotPresent
        command: ["php", "artisan", "migrate", "--force"]
        envFrom:
        - configMapRef:
            name: omnitix-config
        - secretRef:
            name: omnitix-secrets   # <--- THIS WAS MISSING
      containers:
      - name: laravel
        image: omnitix/laravel-core:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: omnitix-config
        - secretRef:
            name: omnitix-secrets
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
