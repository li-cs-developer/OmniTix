services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: omnitix
      POSTGRES_USER: omnitix
      POSTGRES_PASSWORD: omnitix_dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnitix -d omnitix"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  laravel:
    image: licdeveloper/laravel-core:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: omnitix
      DB_USERNAME: omnitix
      DB_PASSWORD: omnitix_dev_password
      DB_SEARCH_PATH: app,public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:9092
      INVENTORY_HTTP_URL: http://go-inventory:8080
      CRYPTO_HTTP_URL: http://rust-crypto:50054
      LEDGER_GRPC_HTTP_URL: http://kotlin-ledger:8082
    ports:
      - "8000:8000"

  go-inventory:
    image: licdeveloper/go-inventory:latest
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:9092
    ports:
      - "8080:8080"

  rust-crypto:
    image: licdeveloper/rust-crypto:latest
    ports:
      - "50054:50054"

  kotlin-ledger:
    image: licdeveloper/kotlin-ledger:latest
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/omnitix
      SPRING_DATASOURCE_USERNAME: omnitix
      SPRING_DATASOURCE_PASSWORD: omnitix_dev_password
      KAFKA_BROKERS: kafka:9092
    ports:
      - "8082:8082"

  nestjs-ws:
    image: licdeveloper/nestjs-ws:latest
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:9092
    ports:
      - "3001:3001"

volumes:
  pgdata:
