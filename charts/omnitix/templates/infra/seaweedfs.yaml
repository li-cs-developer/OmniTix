apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: omnitix
spec:
  selector:
    app: seaweedfs
  ports:
  - port: 8333
    targetPort: 8333
    name: s3
  - port: 9333
    targetPort: 9333
    name: ui
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  namespace: omnitix
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
      - name: seaweedfs
        image: chrislusf/seaweedfs:latest
        command: ["weed", "mini", "-dir=/data", "-master.volumeSizeLimitMB=1024"]
        ports:
        - containerPort: 8333
        - containerPort: 9333
        volumeMounts:
        - name: data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 5Gi
